name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 桩测试（不加载模型、不占 GPU）跑在 Windows 上：
# app/local_fs.py 顶层就用 ctypes.windll，Linux runner 会在 import 阶段炸。
env:
  # GitHub 的 windows-latest 是英文环境，Python 默认用 cp1252 输出，
  # 打印中文会 UnicodeEncodeError 直接崩（2026-10-23 实测：
  # `_test_fit_scan.py` 第 94 行的 print 就炸了）。
  # 强制 UTF-8 让 stdout 走 utf-8，测试输出里的中文才不会挂。
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  stub-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: python -m pip install -r requirements.txt

      - name: 跑桩测试
        run: |
          python tests/_test_fit_scan.py
          python tests/_test_ctxfit_moe.py
          python tests/_test_ctxfit_ornith.py
          python tests/_test_model_scan.py
          python tests/_test_load_guard.py
          python tests/_test_ctx_reload.py
          python tests/_test_ctx_writeback.py
          python tests/_test_ctx_remeasure.py
          python tests/_test_datetime_prefix.py
          python tests/_test_pick_front.py
          python tests/_test_ctx_variants.py

      - name: 前端脚本测试
        run: node tests/_test_key_skip.js
